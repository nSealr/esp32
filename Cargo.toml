# nSealr firmware — Rust cargo workspace.
#
# The all-Rust tree (`crates/`, `apps/`) is the sole firmware backbone; the
# legacy C++ `host_core` and ESP-IDF app that used to live under `firmware/`
# were retired in Phase 03 Task 05. Only crates that already have contents are
# listed as members; `apps/*` and future infra crates are added by the phases
# that create them.
[workspace]
resolver = "2"
members = ["crates/nsealr-core", "apps/desktop-simulator"]

# Reproducible release profile (docs/reproducible-build.md, `make repro-build`).
# `codegen-units = 1` removes codegen parallelism as a variance source, trading
# build speed for a stronger determinism guarantee across differing host core
# counts. Source-path leakage (workspace + vendored-dep absolute paths embedded
# via `file!()`/panic locations) is stripped separately by a stable
# `--remap-path-prefix` rustflag applied via RUSTFLAGS by `ci/repro_build.sh`
# (and shown in the published recipe), because the
# newer `trim-paths` profile option is not stabilized on the pinned stable
# toolchain (1.95.0) — it would require nightly, which the reproducibility pin
# forbids. Both are required by the byte-identity gate and the published recipe.
[profile.release]
codegen-units = 1
